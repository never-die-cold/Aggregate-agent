<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>AgentHub · 智能体会话中枢</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="rail" aria-label="主导航">
      <a class="brand" href="#/overview" aria-label="AgentHub 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path d="M16 3.5 27 9.8v12.4L16 28.5 5 22.2V9.8L16 3.5Z" stroke="currentColor" stroke-width="1.7"/><path d="M10.5 19.5 16 11l5.5 8.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="16" cy="21.2" r="1.7" fill="currentColor"/></svg>
        </span>
        <span class="brand-word">Agent<span>Hub</span></span>
      </a>

      <nav class="rail-nav">
        <button class="rail-link" data-route="overview" title="总览">
          <span class="rail-icon" data-icon="grid"></span><span class="rail-label">总览</span>
        </button>
        <button class="rail-link" data-route="sessions" title="会话">
          <span class="rail-icon" data-icon="chat"></span><span class="rail-label">会话</span>
        </button>
        <button class="rail-link" data-route="projects" title="项目">
          <span class="rail-icon" data-icon="folder"></span><span class="rail-label">项目</span>
        </button>
        <button class="rail-link" data-route="agents" title="智能体">
          <span class="rail-icon" data-icon="cpu"></span><span class="rail-label">智能体</span>
        </button>
      </nav>

      <div class="rail-bottom">
        <button class="rail-link rail-link-ghost" data-route="settings" title="设置">
          <span class="rail-icon" data-icon="sliders"></span><span class="rail-label">设置</span>
        </button>
        <button class="theme-toggle" id="theme-toggle" title="切换主题" aria-label="切换主题">
          <span data-icon="sun"></span>
        </button>
        <div class="rail-status" id="rail-status" title="本地索引状态">
          <span class="status-dot"></span><span class="rail-label">本地</span>
        </div>
      </div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <div class="topbar-left">
          <div class="crumb" id="breadcrumb">总览</div>
          <span class="topbar-sep"></span>
          <span class="topbar-hint" id="topbar-hint">所有数据只在本机读取</span>
        </div>
        <div class="topbar-actions">
          <button class="search-trigger" id="search-trigger" aria-label="全局搜索">
            <span data-icon="search"></span>
            <span class="search-trigger-text">搜索所有会话、项目、代码片段…</span>
            <kbd>Ctrl K</kbd>
          </button>
          <div class="sync-pill" id="sync-pill" title="点击查看数据源">
            <span class="sync-dot"></span><span id="sync-text">就绪</span>
          </div>
          <button class="icon-btn" id="quick-sync" title="立即同步" aria-label="立即同步">
            <span data-icon="refresh"></span>
          </button>
          <button class="icon-btn mobile-only" id="theme-toggle-mobile" title="切换主题" aria-label="切换主题">
            <span data-icon="moon"></span>
          </button>
          <button class="icon-btn mobile-only" data-route="settings" title="设置" aria-label="设置">
            <span data-icon="sliders"></span>
          </button>
        </div>
      </header>

      <main class="view" id="view">
        <div class="boot">
          <div class="boot-mark"></div>
          <p>正在打开会话索引…</p>
        </div>
      </main>
    </div>
  </div>

  <div class="mobile-nav">
    <button data-route="overview"><span data-icon="grid"></span>总览</button>
    <button data-route="sessions"><span data-icon="chat"></span>会话</button>
    <button data-route="search"><span data-icon="search"></span>搜索</button>
    <button data-route="projects"><span data-icon="folder"></span>项目</button>    <button data-route="agents"><span data-icon="cpu"></span>智能体</button>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
